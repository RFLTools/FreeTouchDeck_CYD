; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-2432s028

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

; Monitor configuration
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upload configuration
upload_speed = 921600

; Build flags
build_flags = 
    -D CORE_DEBUG_LEVEL=0
    -D USER_SETUP_LOADED=1
    ; TFT_eSPI Configuration for 480x320 display
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D ILI9488_DRIVER=1
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=4
    -D TOUCH_CS=21
    -D TFT_BL=32
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000

; Filesystem
board_build.filesystem = spiffs
; Uncomment for LittleFS support
;board_build.filesystem = littlefs

; Use larger partition scheme for app (no OTA)
board_build.partitions = no_ota.csv

; Library dependencies
lib_deps = 
    bodmer/TFT_eSPI@^2.5.43
    adafruit/Adafruit GFX Library@^1.11.9
    bblanchon/ArduinoJson@^6.21.5
    https://github.com/T-vK/ESP32-BLE-Keyboard.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    ; Uncomment if using capacitive touch
    ;https://github.com/DustinWatts/FT6236.git

; Additional build options
build_unflags = 

; Configuration for ESP32-2432S028 (Cheap Yellow Display / CYD)
[env:esp32-2432s028]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0

; Build flags for CYD
build_flags = 
    -D CORE_DEBUG_LEVEL=0
    -D USER_SETUP_LOADED=1
    ; TFT_eSPI Configuration for CYD 240x320 ILI9341 display (physical dimensions)
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_INVERSION_ON=1
    ; CYD Pin Configuration
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    ; XPT2046 Resistive Touch Configuration (Separate SPI bus)
    -D TOUCH_CS=33
    -D TOUCH_MOSI=32
    -D TOUCH_MISO=39
    -D TOUCH_CLK=25
    -D TOUCH_IRQ=36
    -D SPI_TOUCH_FREQUENCY=2500000
    ; Font Configuration
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    ; SPI Frequencies
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    ; CYD-specific hardware (optional)
    ; RGB LED on GPIO4 (shared with TFT_RST, be careful!)
    ; LDR (Light sensor) on GPIO34
    ; SD Card: MOSI=23, MISO=19, CLK=18, CS=5

; Filesystem
board_build.filesystem = spiffs
; Use larger partition scheme for app (no OTA)
board_build.partitions = no_ota.csv

; Library dependencies
lib_deps = 
    bodmer/TFT_eSPI@^2.5.43
    adafruit/Adafruit GFX Library@^1.11.9
    bblanchon/ArduinoJson@^6.21.5
    https://github.com/T-vK/ESP32-BLE-Keyboard.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

; Additional build options
build_unflags = 

; Optional: Configuration for ESP32-S3 (ESP32 TouchDown S3)
[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
build_flags = 
    -D CORE_DEBUG_LEVEL=0
    -D USER_SETUP_LOADED=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
board_build.filesystem = spiffs
lib_deps = 
    bodmer/TFT_eSPI@^2.5.43
    adafruit/Adafruit GFX Library@^1.11.9
    bblanchon/ArduinoJson@^6.21.5
    https://github.com/T-vK/ESP32-BLE-Keyboard.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
